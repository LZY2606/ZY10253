<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>移液执行证言台</title>
<style>
  :root { --bg:#0f141b; --panel:#1a2230; --line:#2c3a4f; --fg:#dbe4f0;
          --dim:#8494ab; --ok:#3fb96f; --fail:#e05c5c; --warn:#e0a94f; --acc:#4f9de0; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 "SF Mono", Menlo, Consolas, monospace; }
  header { display:flex; align-items:center; gap:16px; padding:12px 20px;
           background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; }
  .clock { font-size:16px; color:var(--acc); }
  .badge { padding:2px 10px; border-radius:10px; font-size:12px; }
  .b-running { background:#1d3a2a; color:var(--ok); }
  .b-awaiting_recovery { background:#3a2f1d; color:var(--warn); }
  .b-done { background:#1d2f3a; color:var(--acc); }
  .b-superseded { background:#33222a; color:var(--dim); }
  main { display:grid; grid-template-columns: 1fr 1fr; gap:14px; padding:14px 20px; }
  section { background:var(--panel); border:1px solid var(--line);
            border-radius:8px; padding:12px 14px; }
  section h2 { font-size:13px; color:var(--dim); margin:0 0 10px;
               text-transform:uppercase; letter-spacing:1px; }
  .controls { grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  button, select, a.btn { background:#243349; color:var(--fg); border:1px solid var(--line);
         border-radius:6px; padding:6px 14px; cursor:pointer; font:inherit; font-size:13px;
         text-decoration:none; }
  button:hover { background:#2e405c; }
  button.danger { border-color:#5a2f2f; }
  button.recover { border-color:#5a4a2f; color:var(--warn); }
  #msg { color:var(--warn); min-height:18px; }
  .deckgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .slot { border:1px dashed var(--line); border-radius:6px; min-height:110px;
          padding:8px; }
  .slot .sname { color:var(--dim); font-size:11px; }
  .slot .lname { color:var(--acc); font-size:13px; margin:2px 0 6px; }
  .wellgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
  .well { border:1px solid var(--line); border-radius:4px; text-align:center;
          font-size:11px; padding:3px 0; cursor:pointer; }
  .well.filled { background:#1d3a2a; }
  .well.diverge { border-color:var(--warn); }
  .well:hover { border-color:var(--acc); }
  .tips { display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; }
  .tip { width:16px; height:16px; border-radius:3px; border:1px solid var(--line); }
  .tip.present { background:var(--acc); }
  .tip.empty { background:transparent; }
  .pipette { margin-top:10px; font-size:12px; color:var(--warn); }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th, td { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line);
           vertical-align:top; }
  th { color:var(--dim); font-weight:normal; }
  .ev-ok { color:var(--ok); } .ev-failed { color:var(--fail); }
  .ev-recovery { color:var(--warn); } .ev-inject_fault { color:var(--acc); }
  .hash { color:var(--dim); font-size:11px; }
  .timeline-wrap { max-height:340px; overflow-y:auto; }
  #lineage { white-space:pre-wrap; font-size:12px; }
  .banner { grid-column:1 / -1; background:#3a2f1d; border:1px solid var(--warn);
            border-radius:6px; padding:8px 14px; color:var(--warn); }
  .hidden { display:none; }
</style>
</head>
<body>
<header>
  <h1>移液执行证言台</h1>
  <span class="clock" id="clock">t = 0 s</span>
  <span id="status" class="badge"></span>
  <span style="flex:1"></span>
  <label style="color:var(--dim);font-size:12px">运行分支
    <select id="runSelect"></select>
  </label>
</header>
<main>
  <section class="controls">
    <button id="btnStep">单步</button>
    <button id="btnRunAll">连续执行</button>
    <span style="color:var(--dim)">注入故障:</span>
    <button class="danger" data-fault="tip_not_ready">吸头未就绪</button>
    <button class="danger" data-fault="lld_failure">液面检测失败</button>
    <button class="danger" data-fault="motion_conflict">运动冲突</button>
    <button id="btnRecover" class="recover">从最后检查点恢复</button>
    <button id="btnReset">重置 fixture</button>
    <a class="btn" href="/api/export" target="_blank">导出运行记录</a>
    <span id="msg"></span>
  </section>
  <div id="banner" class="banner hidden"></div>

  <section>
    <h2>Deck 布局</h2>
    <div class="deckgrid" id="deck"></div>
    <div class="pipette" id="pipette"></div>
  </section>

  <section>
    <h2>每孔成分谱系 <span id="lineageWell" style="color:var(--acc)"></span></h2>
    <div id="lineage">点击 deck 中的孔查看成分与来源。</div>
  </section>

  <section style="grid-column:1 / -1">
    <h2>操作时线 (前后状态摘要)</h2>
    <div class="timeline-wrap">
    <table>
      <thead><tr>
        <th>#</th><th>t(s)</th><th>事件</th><th>操作</th><th>状态</th>
        <th>前摘要</th><th>后摘要</th>
      </tr></thead>
      <tbody id="timeline"></tbody>
    </table>
    </div>
  </section>
</main>
<script>
let currentRun = null;

async function api(path, body) {
  const opt = body ? {method:'POST', headers:{'Content-Type':'application/json'},
                      body: JSON.stringify(body)} : {};
  const r = await fetch(path, opt);
  return await r.json();
}

function showMsg(t) { document.getElementById('msg').textContent = t || ''; }

function wellTip(lw, wk, w) {
  const phys = Object.entries(w.physical).map(([c,v])=>c+':'+v).join(', ') || '空';
  return lw+'/'+wk+'  物理:'+phys+'  提交:'+(Object.entries(w.committed).map(([c,v])=>c+':'+v).join(', ')||'空');
}

async function refresh() {
  const url = currentRun ? '/api/state?run_id='+encodeURIComponent(currentRun) : '/api/state';
  const s = await (await fetch(url)).json();
  if (!s.run) return;
  currentRun = s.run.run_id;
  document.getElementById('clock').textContent = 't = ' + s.run.sim_time + ' s';
  const st = document.getElementById('status');
  st.textContent = s.run.status;
  st.className = 'badge b-' + s.run.status;

  const sel = document.getElementById('runSelect');
  sel.innerHTML = '';
  s.runs.forEach(r => {
    const o = document.createElement('option');
    o.value = r.run_id; o.textContent = r.run_id + ' (' + r.status + ')';
    if (r.run_id === currentRun) o.selected = true;
    sel.appendChild(o);
  });

  const banner = document.getElementById('banner');
  if (s.run.status === 'awaiting_recovery' && s.run.active) {
    banner.classList.remove('hidden');
    banner.textContent = '操作 ' + s.run.active.op_id + ' 在步骤 ' +
      s.run.active.failed_step + ' 失败 (' + s.run.active.error +
      ')。数据库事务未提交, 但物理吸头状态保留。请从最后检查点恢复。';
  } else if (s.run.summary && s.run.summary.divergent) {
    banner.classList.remove('hidden');
    banner.textContent = '注意: 提交视图与物理状态存在偏差。';
  } else banner.classList.add('hidden');

  // deck
  const deck = document.getElementById('deck');
  deck.innerHTML = '';
  const layout = s.deck.layout, occ = s.deck.occupancy;
  layout.forEach((row, i) => row.forEach((slotNo, j) => {
    const lw = occ[i][j];
    const div = document.createElement('div');
    div.className = 'slot';
    let html = '<div class="sname">槽位 ' + slotNo + '</div>';
    if (lw) {
      html += '<div class="lname">' + lw + ' (' + s.labware[lw].kind + ')</div>';
      if (s.wells[lw]) {
        html += '<div class="wellgrid">';
        Object.entries(s.wells[lw]).forEach(([wk, w]) => {
          const filled = Object.keys(w.physical).length > 0;
          const div2 = JSON.stringify(w.physical) !== JSON.stringify(w.committed);
          html += '<div class="well' + (filled?' filled':'') + (div2?' diverge':'') +
                  '" data-lw="'+lw+'" data-wk="'+wk+'" title="">' +
                  wk + '<br>' + w.volume + '</div>';
        });
        html += '</div>';
      }
      if (s.tips[lw]) {
        html += '<div class="tips">';
        Object.entries(s.tips[lw]).forEach(([p, stt]) => {
          html += '<div class="tip ' + stt + '" title="'+p+':'+stt+'"></div>';
        });
        html += '</div>';
      }
    } else html += '<div style="color:var(--dim);font-size:12px">(空)</div>';
    div.innerHTML = html;
    deck.appendChild(div);
  }));
  deck.querySelectorAll('.well').forEach(el => {
    const lw = el.dataset.lw, wk = el.dataset.wk;
    const w = s.wells[lw][wk];
    el.title = wellTip(lw, wk, w);
    el.onclick = () => showLineage(lw, wk, w);
  });

  document.getElementById('pipette').textContent = s.pipette
    ? '移液器: 吸头 ' + s.pipette.tip_id + ' 内容 ' + s.pipette.volume + ' µL ' +
      JSON.stringify(s.pipette.contents)
    : '移液器: 无吸头';

  // timeline
  const tb = document.getElementById('timeline');
  tb.innerHTML = '';
  s.timeline.forEach(e => {
    const tr = document.createElement('tr');
    const sum = x => (x && x.hash ? x.hash.slice(0,8) : '-') +
      (x && x.tip ? ' 吸头:' + x.tip.volume : '');
    tr.innerHTML = '<td>'+e.seq+'</td><td>'+e.sim_time+'</td>' +
      '<td class="ev-'+e.status+' ev-'+e.type+'">'+e.type+'</td>' +
      '<td>'+(e.op_id||'')+'</td>' +
      '<td class="ev-'+e.status+'">'+e.status+'</td>' +
      '<td class="hash">'+sum(e.pre)+'</td><td class="hash">'+sum(e.post)+'</td>';
    tb.appendChild(tr);
  });
}

function showLineage(lw, wk, w) {
  document.getElementById('lineageWell').textContent = lw + ' / ' + wk;
  let t = '当前成分 (物理): ' + JSON.stringify(w.physical) + '\n' +
          '已提交成分:       ' + JSON.stringify(w.committed) + '\n' +
          '体积: ' + w.volume + ' / ' + w.capacity + ' µL\n谱系:\n';
  if (!w.lineage.length) t += '  (无注入记录)\n';
  w.lineage.forEach(l => {
    t += '  <- ' + l.op + ' 注入 ' + l.volume + ' µL ' +
         JSON.stringify(l.components) + '  [' + l.event + ']\n';
  });
  document.getElementById('lineage').textContent = t;
}

document.getElementById('btnStep').onclick = async () => {
  const r = await api('/api/step', {run_id: currentRun});
  showMsg(r.error || (r.event ? r.event.event_id : ''));
  refresh();
};
document.getElementById('btnRunAll').onclick = async () => {
  const r = await api('/api/run_all', {run_id: currentRun});
  showMsg(r.stopped ? '停止: ' + r.stopped : '完成');
  refresh();
};
document.querySelectorAll('button[data-fault]').forEach(b => {
  b.onclick = async () => {
    const r = await api('/api/inject', {run_id: currentRun, kind: b.dataset.fault});
    showMsg(r.error || '已注入: ' + b.textContent);
    refresh();
  };
});
document.getElementById('btnRecover').onclick = async () => {
  const r = await api('/api/recover', {run_id: currentRun});
  if (r.new_run_id) { currentRun = r.new_run_id; showMsg('已恢复到分支 ' + r.new_run_id); }
  else showMsg(r.error || '恢复失败');
  refresh();
};
document.getElementById('btnReset').onclick = async () => {
  await api('/api/reset'); currentRun = null; showMsg('已重置'); refresh();
};
document.getElementById('runSelect').onchange = e => { currentRun = e.target.value; refresh(); };

refresh();
</script>
</body>
</html>
