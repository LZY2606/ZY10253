<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>移液执行证言台</title>
<style>
:root {
  --bg: #0f1420;
  --panel: #182030;
  --panel2: #1f2a3d;
  --line: #2c3a52;
  --text: #e7edf7;
  --muted: #93a2bb;
  --accent: #4ea1ff;
  --ok: #43c08a;
  --warn: #f0b34f;
  --bad: #f06a6a;
  --held: #b98cff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
}
header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  background: linear-gradient(180deg, #141b29, #0f1420);
}
header h1 { font-size: 18px; margin: 0; letter-spacing: 1px; }
.clock { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; }
.status { padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.status.ready { color: var(--ok); border-color: var(--ok); }
.status.done { color: var(--accent); border-color: var(--accent); }
.status.failed { color: var(--bad); border-color: var(--bad); }
.status.recovered { color: var(--warn); border-color: var(--warn); }
main { display: grid; grid-template-columns: 360px 1fr 360px; gap: 14px; padding: 14px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.panel h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.deck { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.slot { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px; min-height: 70px; }
.slot .slot-name { color: var(--muted); font-size: 11px; }
.slot .slot-label { font-weight: 600; margin-bottom: 4px; }
.slot.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.well { display: flex; justify-content: space-between; font-size: 12px; padding: 1px 0; }
.well .vol { font-variant-numeric: tabular-nums; color: var(--muted); }
.tips { display: flex; gap: 4px; flex-wrap: wrap; }
.tip { font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.tip.picked { color: #fff; background: var(--accent); border-color: var(--accent); }
.tip.empty { color: var(--held); border-color: var(--held); }
.tip.waste { opacity: .35; }
button, select, input[type=text] {
  font: inherit;
  background: var(--panel2);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 10px;
  cursor: pointer;
}
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #08111f; font-weight: 600; }
button.danger { border-color: var(--bad); color: var(--bad); }
button:disabled { opacity: .4; cursor: not-allowed; }
.controls { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.timeline { max-height: 340px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.event { display: grid; grid-template-columns: 38px 90px 1fr auto; gap: 8px; padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: 12px; align-items: center; }
.event:last-child { border-bottom: none; }
.event .seq { color: var(--muted); }
.event.fail { background: rgba(240,106,106,.08); }
.event.commit { box-shadow: inset 3px 0 0 var(--ok); }
.tag { font-size: 10px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.tag.ok { color: var(--ok); border-color: var(--ok); }
.tag.fail { color: var(--bad); border-color: var(--bad); }
.tag.resume { color: var(--warn); border-color: var(--warn); }
.beforeafter { font-size: 11px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.lineage { font-size: 12px; }
.lineage .lrow { padding: 4px 0; border-bottom: 1px dashed var(--line); }
.pill { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--panel2); border: 1px solid var(--line); margin: 1px 2px; }
.pill.held { color: var(--held); border-color: var(--held); }
.notice { font-size: 12px; color: var(--warn); margin: 6px 0; }
.runs { font-size: 12px; max-height: 140px; overflow: auto; }
.runline { padding: 3px 4px; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
.runline:hover { background: var(--panel2); }
.runline.active { background: var(--panel2); outline: 1px solid var(--accent); }
.muted { color: var(--muted); }
.rightcol { display: flex; flex-direction: column; gap: 14px; }
.conservation { font-size: 12px; }
textarea { width: 100%; height: 120px; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; font: 11px/1.4 ui-monospace, monospace; }
details summary { cursor: pointer; color: var(--muted); margin: 6px 0; }
@media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>移液执行证言台</h1>
  <span class="muted">离散事件重放 · 有理微升容量 · 检查点恢复</span>
  <span style="flex:1"></span>
  <span>运行 #<b id="runId">—</b></span>
  <span>模拟时钟 <span class="clock" id="clock">0 s</span></span>
  <span class="status" id="runStatus">未创建</span>
</header>
<main>
  <section class="panel" id="deckPanel">
    <h2>Deck 布局</h2>
    <div class="controls">
      <button class="primary" id="newRun">新建运行</button>
      <select id="runSelect" title="选择运行"></select>
    </div>
    <div class="deck" id="deck"></div>
    <h2 style="margin-top:12px">运行谱系</h2>
    <div class="runs" id="runTree"></div>
  </section>

  <section class="panel">
    <h2>操作时线（单微操作为一步）</h2>
    <div class="controls">
      <button class="primary" id="stepBtn">单步执行</button>
      <button id="replayBtn" title="用当前事件的 replay_key 再重放一次">重放当前步</button>
      <select id="faultType">
        <option value="tip_not_ready">吸头未就绪</option>
        <option value="level_fail">液面检测失败</option>
        <option value="motion_conflict">运动冲突</option>
      </select>
      <button class="danger" id="injectBtn">注入故障</button>
      <button id="resumeBtn" style="display:none">从检查点恢复（新分支）</button>
    </div>
    <div class="notice" id="notice"></div>
    <div class="timeline" id="timeline"></div>
    <details>
      <summary>操作前后状态摘要（最近一步）</summary>
      <div class="beforeafter" id="summary"></div>
    </details>
  </section>

  <section class="rightcol">
    <div class="panel">
      <h2>每孔成分谱系</h2>
      <div class="lineage" id="lineage"></div>
    </div>
    <div class="panel conservation">
      <h2>守恒核对（NumPy 复核）</h2>
      <div id="conservation"></div>
    </div>
    <div class="panel">
      <h2>运行记录</h2>
      <div class="controls">
        <button id="exportBtn">导出 JSON</button>
        <button id="copyBtn">复制导出</button>
        <button class="danger" id="resetBtn">清空数据库</button>
        <button id="importBtn">导入复核</button>
      </div>
      <textarea id="ioBox" placeholder="导出的 JSON 会显示在这里；粘贴后可“导入复核”。"></textarea>
    </div>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
